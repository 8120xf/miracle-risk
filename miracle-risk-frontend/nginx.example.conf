# 示例：仅静态托管 Vue 构建产物（dist/）
# 复制到服务器后修改 server_name、ssl_certificate、root

server {
  listen 443 ssl http2;
  server_name your-risk-frontend.example.com;

  # ssl_certificate     /path/to/fullchain.pem;
  # ssl_certificate_key /path/to/privkey.pem;

  root /var/www/miracle-risk-frontend/dist;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # 若采用「同域反代 API」，可取消注释并指向后端（此时构建时 VITE_API_BASE_URL 建议为空，请求 /api）
  # location /api/ {
  #   proxy_pass https://your-backend.internal/;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Real-IP $remote_addr;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #   proxy_set_header X-Forwarded-Proto $scheme;
  # }
}

server {
  listen 80;
  server_name your-risk-frontend.example.com;
  return 301 https://$host$request_uri;
}
